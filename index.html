<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Card Tracker</h1>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="cards">Cards</button>
  </nav>
  <main>
    <section class="tab-panel active" id="panel-cards">
      <div class="table-wrap">
        <table id="cards-table">
          <thead>
            <tr>
              <th>Issuer</th>
              <th>Card</th>
              <th>Type</th>
              <th>Retention</th>
              <th>Annual Fee</th>
              <th>Opened</th>
              <th>PC</th>
              <th>From</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
