<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card Credits Tracker</title>
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <header class="topbar">
    <h1>Credit Tracker</h1>
    <div class="summary">
      <div class="stat">
        <span class="stat-label">Captured YTD</span>
        <span class="stat-value" id="stat-ytd">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Annual fees</span>
        <span class="stat-value" id="stat-fees">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Unused this period</span>
        <span class="stat-value" id="stat-unused">$0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Expiring &lt; 30 days</span>
        <span class="stat-value" id="stat-expiring">0</span>
      </div>
    </div>
  </header>

  <main>
    <section id="expiring-section" class="card-list hidden">
      <h2>Use these soon</h2>
      <div id="expiring-list"></div>
    </section>

    <section class="toolbar">
      <button id="add-card-btn" class="primary">+ Add Card</button>
      <button id="add-credit-btn">+ Add Credit</button>
      <button id="export-btn" class="ghost">Export</button>
      <button id="import-btn" class="ghost">Import</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </section>

    <section id="cards-section">
      <div id="cards-list"></div>
      <p id="empty-state" class="empty">No cards yet. Add your first card to get started.</p>
    </section>
  </main>

  <!-- Card dialog -->
  <dialog id="card-dialog">
    <form method="dialog" id="card-form">
      <h3 id="card-dialog-title">Add Card</h3>
      <label>Card name
        <input name="name" required placeholder="Amex Platinum" />
      </label>
      <label>Issuer
        <input name="issuer" placeholder="American Express" />
      </label>
      <label>Last 4 digits
        <input name="last4" maxlength="4" pattern="\d{0,4}" placeholder="1234" />
      </label>
      <label>Annual fee ($)
        <input name="annualFee" type="number" step="0.01" min="0" placeholder="0" />
      </label>
      <label>Accent color
        <input type="color" name="color" value="#4f46e5" />
      </label>
      <input type="hidden" name="id" />
      <menu>
        <button value="cancel" type="button" data-close>Cancel</button>
        <button value="save" class="primary" type="submit">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- Credit dialog -->
  <dialog id="credit-dialog">
    <form method="dialog" id="credit-form">
      <h3 id="credit-dialog-title">Add Credit</h3>
      <label>Card
        <select name="cardId" id="credit-card-select" required></select>
      </label>
      <label>Credit name
        <input name="name" required placeholder="Dining credit" />
      </label>
      <label>Value ($)
        <input name="value" type="number" step="0.01" min="0" required placeholder="25" />
      </label>
      <label class="checkbox">
        <input type="checkbox" name="variable" />
        Variable amount (enter used $ each time, e.g. flight credit)
      </label>
      <label class="checkbox">
        <input type="checkbox" name="ignored" />
        I'm never using this credit (grey it out, exclude from totals)
      </label>
      <label>Resets
        <select name="frequency" required>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="semiannual">Every 6 months</option>
          <option value="annual">Annually</option>
          <option value="one-time">One-time</option>
        </select>
      </label>
      <label>Reset anchor date
        <input name="resetDate" type="date" required />
        <small>First day of a period (e.g. Jan 1 for calendar-year credits, or card anniversary).</small>
      </label>
      <label>Notes
        <textarea name="notes" rows="2" placeholder="Uber Eats only, enroll required"></textarea>
      </label>
      <input type="hidden" name="id" />
      <menu>
        <button value="delete" type="button" id="credit-delete-btn" class="danger hidden">Delete</button>
        <button value="cancel" type="button" data-close>Cancel</button>
        <button value="save" class="primary" type="submit">Save</button>
      </menu>
    </form>
  </dialog>

  <!-- History dialog -->
  <dialog id="history-dialog">
    <h3 id="history-title">History</h3>
    <p class="card-sub" id="history-sub"></p>
    <div id="history-list"></div>
    <menu>
      <button type="button" data-close class="primary">Done</button>
    </menu>
  </dialog>

  <script src="app.js?v=15"></script>
</body>
</html>
