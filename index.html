<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Wallet</title>
  <link rel="stylesheet" href="styles.css?v=148">
</head>
<body>
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-header-text">
        <h1>Card Wallet</h1>
        <p class="subtitle">Track Fees, Retention, and Renewal Countdowns.</p>
        <p class="last-saved" id="last-saved"></p>
      </div>
      <div class="app-actions">
        <select id="sort-key" class="btn-ghost btn-select" aria-label="Sort">
          <option value="opened-asc">Oldest First</option>
          <option value="opened-desc">Newest First</option>
          <option value="issuer-asc">Issuer (A–Z)</option>
          <option value="card-asc">Card (A–Z)</option>
          <option value="annualFee-desc">Annual Fee (High → Low)</option>
          <option value="annualFee-asc">Annual Fee (Low → High)</option>
          <option value="type-asc">Type</option>
          <option value="retention-asc">Retention</option>
        </select>
        <button class="btn-ghost" id="theme-toggle" aria-label="Toggle theme" title="Toggle dark mode">Dark</button>
        <button class="btn-ghost" id="import-cards">Import</button>
        <button class="btn-ghost" id="export-cards">Export</button>
        <button class="btn-ghost" id="header-edit" disabled title="Select a card first">Edit</button>
        <button class="btn-danger-ghost" id="header-delete" disabled title="Select a card first">Delete</button>
        <button class="btn-ghost" id="add-card">+ Add Card</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="cards">Cards</button>
    </nav>
  </header>
  <main>
    <section class="tab-panel active" id="panel-cards">
      <div class="stats" id="stats"></div>
      <div class="detail-panel" id="detail-panel" hidden></div>
      <div class="cards-grid" id="cards-grid"></div>
      <p class="grid-empty" id="grid-empty" hidden>No cards match your filters.</p>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Edit Card</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">×</button>
      </div>
      <form id="card-form" class="modal-body">
        <label><span>Issuer</span><input name="issuer" type="text" required></label>
        <label><span>Card</span><input name="card" type="text" required></label>
        <label><span>Type</span>
          <select name="type">
            <option value="Personal">Personal</option>
            <option value="Business">Business</option>
          </select>
        </label>
        <label><span>Retention</span>
          <select name="retention">
            <option value="Yes">Keep</option>
            <option value="No">Cancel</option>
            <option value="Maybe">Undecided</option>
          </select>
        </label>
        <label><span>Annual Fee ($)</span><input name="annualFee" type="number" min="0" step="1" required></label>
        <label><span>Opened</span><input name="opened" type="date" required></label>
        <label><span>Network</span>
          <select name="network">
            <option value="Amex">Amex</option>
            <option value="Visa">Visa</option>
            <option value="Mastercard">Mastercard</option>
            <option value="Discover">Discover</option>
          </select>
        </label>
        <label><span>Point Currency</span><input name="pointCurrency" type="text" placeholder="Membership Rewards, Cash, etc."></label>
        <label><span>Base Rate (All Other)</span>
          <div class="inline-fields">
            <input name="baseRateValue" type="number" min="0" step="0.5" placeholder="1">
            <select name="baseRateUnit">
              <option value="x">x</option>
              <option value="%">%</option>
            </select>
          </div>
        </label>
        <label><span>Earns (one per line)</span><textarea name="earns" rows="5" placeholder="5x Chase Travel&#10;3% Dining"></textarea></label>
        <div class="modal-footer">
          <button type="button" class="btn-danger" id="delete-card" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="btn-ghost" id="cancel-card">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="cards.js?v=148"></script>
  <script src="app.js?v=148"></script>
</body>
</html>
