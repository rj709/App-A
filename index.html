<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Kit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="3.4"></circle>
          <path d="M12 3v5.6M21 12h-5.6M12 21v-5.6M3 12h5.6"></path>
        </svg>
        Camera Kit
      </h1>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="gear" role="tab" aria-selected="true">Gear</button>
      </nav>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <nav class="cat-nav" id="cat-nav" aria-label="Categories"></nav>
      <div class="sidebar-foot">
        <span class="sidebar-foot-label" id="scope-label">Total Value</span>
        <span class="sidebar-foot-value" id="scope-value">$0.00</span>
      </div>
    </aside>

    <main class="app-main">
      <section id="tab-gear" class="tab-panel is-active" role="tabpanel">
        <div class="summary">
          <div class="summary-stats">
            <div class="summary-stat summary-stat-hero">
              <span class="summary-stat-label">Total Value</span>
              <span class="summary-stat-value" id="summary-value">$0.00</span>
            </div>
            <div class="summary-stat">
              <span class="summary-stat-label">Items</span>
              <span class="summary-stat-value" id="summary-count">0</span>
            </div>
            <div class="summary-stat">
              <span class="summary-stat-label">Categories</span>
              <span class="summary-stat-value" id="summary-cats">0</span>
            </div>
          </div>
          <div class="breakdown" id="breakdown" aria-hidden="true"></div>
        </div>

        <div class="toolbar">
          <div class="toolbar-search">
            <input type="search" id="search" placeholder="Search Gear…" autocomplete="off">
            <button type="button" id="group-toggle" class="btn btn-ghost toggle-btn" aria-pressed="false">Group by Type</button>
          </div>
          <div class="toolbar-actions">
            <button type="button" id="export-btn" class="btn btn-ghost" title="Export JSON">Export</button>
            <button type="button" id="import-btn" class="btn btn-ghost" title="Import JSON or CSV">Import</button>
            <input type="file" id="import-file" accept=".json,.csv,application/json,text/csv" hidden>
            <button type="button" id="add-gear-btn" class="btn btn-primary">+ Add Gear</button>
          </div>
        </div>

        <div class="gear-table">
          <div class="gear-thead" role="row">
            <button class="gear-th gear-col-item" data-sort="name" type="button">Item<span class="sort-arrow"></span></button>
            <button class="gear-th gear-col-category" data-sort="category" type="button">Category<span class="sort-arrow"></span></button>
            <button class="gear-th gear-col-qty" data-sort="quantity" type="button">Qty<span class="sort-arrow"></span></button>
            <button class="gear-th gear-col-price" data-sort="price" type="button">Price<span class="sort-arrow"></span></button>
          </div>
          <div class="gear-tbody" id="gear-list" aria-live="polite"></div>
        </div>

        <div class="empty-state" id="empty-state">
          <p>No Gear Yet.</p>
          <button type="button" class="btn btn-primary" id="empty-add-btn">Add Your First Item</button>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="gear-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <header class="modal-head">
        <h2 id="modal-title">Add Gear</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
      </header>
      <form id="gear-form" class="gear-form" novalidate>
        <input type="hidden" name="id">
        <div class="row">
          <div class="field">
            <label for="f-brand">Brand</label>
            <input id="f-brand" name="brand" placeholder="Sony">
          </div>
          <div class="field">
            <label for="f-model">Model</label>
            <input id="f-model" name="model" placeholder="A7 IV">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="f-category">Category</label>
            <select id="f-category" name="category" required></select>
          </div>
          <div class="field">
            <label for="f-serial">Serial #</label>
            <input id="f-serial" name="serial" placeholder="Optional">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="f-price">Price (USD)</label>
            <input id="f-price" name="price" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="field">
            <label for="f-quantity">Quantity</label>
            <input id="f-quantity" name="quantity" type="number" min="1" step="1" value="1">
          </div>
        </div>
        <div class="field">
          <label class="checkbox-label" for="f-pack">
            <input id="f-pack" name="pack" type="checkbox">
            <span>Price is for the whole pack, not each</span>
          </label>
        </div>
        <div class="field">
          <label for="f-purchaseDate">Purchase Date</label>
          <input id="f-purchaseDate" name="purchaseDate" type="date">
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" name="notes" rows="3" placeholder="Anything Worth Remembering…"></textarea>
        </div>
        <footer class="modal-actions">
          <button type="button" class="btn btn-danger" id="delete-btn" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js?v=12"></script>
</body>
</html>
